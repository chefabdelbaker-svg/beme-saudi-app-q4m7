const pinHash=async(id,p)=>{const d=id+":beme-ksa:"+p;try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(d));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}}catch(e){}let h=0x811c9dc5,o="";for(let k=0;k<8;k++){for(let i=0;i<d.length;i++){h^=d.charCodeAt(i)+k;h=Math.imul(h,16777619)>>>0}o+=h.toString(16).padStart(8,"0")}return(o+o).slice(0,64)};
const lockGet=id=>{try{return(JSON.parse(localStorage.getItem("beme_lock")||"{}"))[id]||{n:0,u:0}}catch(e){return{n:0,u:0}}};
const lockSet=(id,v)=>{try{const o=JSON.parse(localStorage.getItem("beme_lock")||"{}");o[id]=v;localStorage.setItem("beme_lock",JSON.stringify(o))}catch(e){}};

const seedHash=async(t,p)=>{const d="seed:"+t+":"+p;try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(d));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}}catch(e){}return""};
window.pinAsk=(x,ok,create)=>{
 const first=create||(!x.pin&&!PSEED[x.title]);let step=first?1:0,buf="",first1="";
 const m=sheet(`<div class="pinbox"><div class="pav">${avIcon(x)}</div><div class="pinh"><b id="pinT"></b><small></small></div><div class="pdots" role="img"></div><div class="pmsg" role="alert"></div><div class="pkeys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join("")}<button type="button" data-k="x" aria-label="${L("Effacer","Delete")}">⌫</button><button type="button" data-k="0">0</button><button type="button" data-k="ok" class="go" aria-label="${L("Valider","Confirm")}">OK</button></div><button type="button" class="btn sm pcx" style="width:100%;margin-top:8px">${t("cancel")}</button></div>`);
 const opener=document.activeElement,box=m.querySelector(".box");box.setAttribute("role","dialog");box.setAttribute("aria-modal","true");box.setAttribute("aria-labelledby","pinT");let tmr=0;const rm0=m.remove.bind(m);m.remove=()=>{clearInterval(tmr);rm0();try{opener&&opener.focus&&opener.focus()}catch(e){}};
 const H=m.querySelector(".pinh b"),S=m.querySelector(".pinh small"),D=m.querySelector(".pdots"),M=m.querySelector(".pmsg");
 const paint=()=>{H.textContent=x.name||x.title;S.textContent=step===1?L("Première connexion : choisissez un code (4 à 6 chiffres)","First sign-in: choose a code (4 to 6 digits)"):step===2?L("Confirmez votre code","Confirm your code"):L("Entrez votre code d'accès","Enter your access code");D.innerHTML=Array.from({length:6},(_,i)=>`<i class="${i<buf.length?"on":""}"></i>`).join("");D.setAttribute("aria-label",buf.length+" / 6 "+L("chiffres","digits"))};
 const msg=(t1,bad)=>{M.textContent=t1||"";M.classList.toggle("bad",!!bad)};
 const shake=()=>{D.classList.remove("shk");void D.offsetWidth;D.classList.add("shk")};
 const lockMsg=()=>{const K=m.querySelector(".pkeys");const l=lockGet(x.id);const r=Math.ceil((l.u-Date.now())/1000);if(r>0){msg(L("Trop d'essais. Réessayez dans "+r+" s.","Too many attempts. Try again in "+r+" s."),1);K.classList.add("off");if(!tmr)tmr=setInterval(lockMsg,1000);return true}K.classList.remove("off");if(tmr){clearInterval(tmr);tmr=0;msg("")}return false};
 const submit=async()=>{
  if(buf.length<4){msg(L("4 chiffres minimum.","4 digits minimum."),1);shake();return}
  if(step===1){first1=buf;buf="";step=2;msg("");paint();return}
  if(step===2){if(buf!==first1){buf="";first1="";step=1;msg(L("Les deux codes ne correspondent pas. Recommencez.","Codes do not match. Start over."),1);shake();paint();return}
   x.pin=await pinHash(x.id,buf);const i=DB.profiles.findIndex(y=>y.id===x.id);if(i>=0)DB.profiles[i].pin=x.pin;persist();m.remove();ok();return}
  if(lockMsg()){buf="";paint();return}
  const h=await pinHash(x.id,buf);
  let good=h===x.pin;if(!good&&!x.pin&&PSEED[x.title]&&await seedHash(x.title,buf)===PSEED[x.title]){x.pin=h;const i=DB.profiles.findIndex(y=>y.id===x.id);if(i>=0)DB.profiles[i].pin=h;persist();good=true}
  if(good){lockSet(x.id,{n:0,u:0});m.remove();ok();return}
  const l=lockGet(x.id);l.n++;if(l.n>=5){l.n=0;l.u=Date.now()+30000}lockSet(x.id,l);buf="";shake();paint();if(!lockMsg())msg(L("Code incorrect.","Wrong code."),1)};
 m.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.classList.contains("pcx")){m.remove();return}const k=b.dataset.k;if(k===undefined)return;if(k==="x"){buf=buf.slice(0,-1);msg("")}else if(k==="ok")submit();else if(buf.length<6){buf+=k;msg("")}paint()});
 m.addEventListener("keydown",e=>{if(e.key==="Tab"){const f=[...m.querySelectorAll("button")],a=f[0],z=f[f.length-1];if(e.shiftKey&&(document.activeElement===a||document.activeElement===m)){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}return}if(e.target.closest&&e.target.closest("button")&&(e.key==="Enter"||e.key===" "))return;if(/^\d$/.test(e.key)&&buf.length<6){e.preventDefault();buf+=e.key;msg("");paint()}else if(e.key==="Backspace"){buf=buf.slice(0,-1);paint()}else if(e.key==="Enter")submit()});
 m.classList.add("pinm");m.tabIndex=-1;paint();lockMsg();(m.querySelector(".pkeys button")||m).focus();
};
