function sanitize(d){
 if(!d||typeof d!=="object")return null;
 const out={fx:{SAR:1,EUR:4.1,AED:1.02},qseq:Math.max(0,parseInt(d.qseq)||0),settings:DEFSET()};
 ["EUR","AED"].forEach(c=>{const v=+(d.fx&&d.fx[c]);if(v>0&&isFinite(v))out.fx[c]=v});
 const s=d.settings&&typeof d.settings==="object"?d.settings:{};
 out.settings.maxDisc=Math.min(100,Math.max(0,+s.maxDisc>=0?+s.maxDisc:5));out.settings.wMonths=Math.min(120,Math.max(1,Math.round(+s.wMonths||24)));

 Object.keys(out.settings.co).forEach(k=>{const v=s.co&&s.co[k];if(typeof v==="string")out.settings.co[k]=v.slice(0,200)});
 COLLS.forEach(k=>{
  out[k]=(Array.isArray(d[k])?d[k]:[]).filter(r=>r&&typeof r==="object"&&IDRE.test(String(r.id))).map(r=>{
   const o=Object.fromEntries(Object.entries(r).filter(([a])=>a!=="__proto__"&&a!=="constructor"));
   if(ENUMS[k])Object.entries(ENUMS[k]).forEach(([f,g])=>{if(!own(OPT[g],o[f]))o[f]=Object.keys(OPT[g])[0]});
   if(CURCOLL.includes(k)&&!CURS.includes(o.cur))o.cur="SAR";
   ["client","quote","order","equip","stock"].forEach(f=>{if(o[f]!==undefined&&o[f]!==""&&!IDRE.test(String(o[f])))o[f]=""});
   if(k==="quotes"){o.items=(Array.isArray(o.items)?o.items:[]).map(i=>({type:own(OPT.ltype,i&&i.type)?i.type:"equipment",stock:IDRE.test(String(i&&i.stock))?i.stock:"",desc:String(i&&i.desc||""),qty:+(i&&i.qty)||0,price:+(i&&i.price)||0,opt:!!(i&&i.opt),inc:!!(i&&i.inc)}));o.vat=+o.vat||0;o.disc=Math.min(100,Math.max(0,+o.disc||0))}
   return o})});
 return out}

let NAV=[];
window.go=p=>{window.QS="";location.hash="#"+p};
window.goBack=()=>{const prev=NAV.length>1?NAV[NAV.length-2]:"home";NAV.length=Math.max(NAV.length-2,0);go(prev)};
const allowed=()=>["home"].concat(PAGES.filter(p=>can("view",p)));
window.openProfile=()=>{const m=sheet(`<h3>${esc(ME.name)}</h3><p class="mut">${t("role_"+ME.role)}</p><div class="menu"><button id="pl">${t("lang")}</button><button id="ps">${t("logout")}</button><button id="px" style="color:var(--mut)">${t("cancel")}</button></div>`);
 m.querySelector("#pl").onclick=()=>{LANG=LANG==="fr"?"en":"fr";localStorage.setItem("beme_lang",LANG);m.remove();render()};
 m.querySelector("#ps").onclick=()=>{m.remove();ME=null;NAV=[];sessionStorage.removeItem("beme_me");render()};m.querySelector("#px").onclick=()=>m.remove()};
window.openMore=()=>{const tabs=TABS[ME.role]||[];const rest=allowed().filter(p=>p!=="home"&&!tabs.includes(p));const m=sheet(`<h3>${t("more")}</h3><div class="menu">${rest.map(p=>`<button data-p="${p}">${esc(t(p))}</button>`).join("")}<button data-p="x" style="color:var(--mut)">${t("cancel")}</button></div>`);m.querySelectorAll("button").forEach(b=>b.onclick=()=>{m.remove();if(b.dataset.p!=="x")go(b.dataset.p)})};
function render(keep){
 const app=$("#app");document.documentElement.lang=LANG;
 if(!ME){app.innerHTML=`<div class="login"><div class="in"><img src="assets/beme-logo-white.png" alt="BEME"><h2 style="color:#fff;text-align:center;margin-bottom:14px">Operations</h2>
  <label for="ln">${t("name")}</label><input id="ln" maxlength="60" autocomplete="name">
  <label for="lr">${t("role")}</label><select id="lr">${ROLES.map(r=>`<option value="${r}">${t("role_"+r)}</option>`).join("")}</select>
  <div style="display:flex;gap:10px;margin-top:18px"><button class="btn gold" style="flex:1" id="lgo">${t("login")}</button><button class="btn" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.5)" id="llang">${t("lang")}</button></div><p class="mut" style="margin-top:14px;font-size:12px">${t("demo")}</p></div></div>`;
  $("#lgo").onclick=()=>{const n=$("#ln").value.trim();if(!n){$("#ln").focus();return}ME={name:n,role:$("#lr").value};sessionStorage.setItem("beme_me",JSON.stringify(ME));NAV=[];render()};
  $("#llang").onclick=()=>{LANG=LANG==="fr"?"en":"fr";localStorage.setItem("beme_lang",LANG);render()};return}
 let p=location.hash.slice(1)||"home";if(!(p==="home"||(PAGES.includes(p)&&can("view",p))))p="home";
 if(NAV[NAV.length-1]!==p)NAV.push(p);
 const foc=keep&&document.activeElement&&document.activeElement.tagName==="INPUT"?document.activeElement.selectionStart:null;
 MN=[];
 const body=V[p]();
 const tabs=(TABS[ME.role]||[]).filter(x=>can("view",x));const hasMore=allowed().filter(x=>x!=="home"&&!tabs.includes(x)).length>0;
 const tab=(id,label,on,click)=>`<button class="tab ${on?"on":""}" onclick="${click}">${ico(id)}<span>${esc(label)}</span></button>`;
 app.innerHTML=`<header class="appbar"><button class="ib" ${p==="home"?"hidden":""} aria-label="${t("back")}" onclick="goBack()">${ico("back","width:22px;height:22px")}</button><img src="assets/beme-logo-white.png" alt="BEME"><span class="sp"></span><button class="ib av" aria-label="Profil" onclick="openProfile()">${esc(ME.name.slice(0,1).toUpperCase())}</button></header>
 <aside class="side">${allowed().map(x=>`<button class="${x===p?"on":""}" onclick="go('${x}')">${ico(x)}${esc(t(x))}</button>`).join("")}</aside>
 <main>${body}</main>
 <nav class="tabbar" aria-label="Navigation">${tab("home",t("home"),p==="home","go('home')")}${tabs.map(x=>tab(x,t(x),p===x,`go('${x}')`)).join("")}${hasMore?tab("more",t("more"),false,"openMore()"):""}</nav>`;
 if(foc!==null){const i=document.querySelector("main input[type=search]");if(i){i.focus();i.setSelectionRange(foc,foc)}}
}
window.addEventListener("hashchange",()=>render());
render();
</script>
</body>
</html>
