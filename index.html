<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#12284c">
<title>BEME Saudi — Management</title>
<style>
:root{--navy:#12284c;--gold:#BF9F5F;--ivory:#faf7f0;--ink:#1d2433;--mut:#5d6578;--line:#e6dfcf;--red:#a3302a;--green:#2a7048;--orange:#8a4a0f}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--ivory);color:var(--ink)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--navy);margin:0}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:3px solid var(--gold);display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px}
header img{height:34px}
header .sp{flex:1}
button,.btn{font:inherit;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--navy);color:#fff}
button.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:600}
button.sm{padding:5px 9px;font-size:13px;min-height:32px}
button.danger{border-color:var(--red);color:var(--red)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
@media(pointer:coarse){button.sm{min-height:42px;min-width:42px}}
main{max-width:1050px;margin:0 auto;padding:14px}
.bar{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:16px 14px;text-align:left;font-family:Georgia,serif;font-size:16px;color:var(--navy)}
.kpi{font:600 22px Georgia,serif;color:var(--navy)}
.lbl{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:600}
.tw{overflow-x:auto}
.tw td:last-child,.tw th:last-child{position:sticky;right:0;background:#fff;box-shadow:-6px 0 6px -6px rgba(0,0,0,.18)}
.act{display:flex;gap:6px;flex-wrap:nowrap}
.badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;background:#eef1f7;color:var(--navy)}
.badge.g{background:#e3f3ea;color:var(--green)}.badge.o{background:#fbeedd;color:var(--orange)}.badge.r{background:#f9e2df;color:var(--red)}
.alert{border-left:4px solid #c9772b;background:#fff8ef;padding:9px 10px;margin-bottom:6px;border-radius:6px;font-size:14px;cursor:pointer}
.alert.r{border-color:var(--red);background:#fdf0ee}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:8px;border:1px solid #bdb59f;border-radius:8px;background:#fff}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.modal{position:fixed;inset:0;background:rgba(18,40,76,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:12px;z-index:20}
.modal .box{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:520px;margin:auto}
.foot{position:sticky;bottom:-16px;background:#fff;padding:10px 0 4px;margin-top:12px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thumb{width:48px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#f1ede2}
.login{max-width:420px;margin:7vh auto;text-align:center}
.login img{width:230px}
.note{font-size:12px;color:var(--mut)}
.stages{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.toast{position:fixed;left:12px;right:12px;bottom:14px;background:var(--red);color:#fff;padding:12px;border-radius:10px;z-index:50;text-align:center}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ===== Langue ===== */
let LANG=localStorage.getItem("beme_lang")==="en"?"en":"fr";
const L=(fr,en)=>LANG==="fr"?fr:en;
const T={
fr:{home:"Accueil",back:"Retour",clients:"Clients à contacter",quotes:"Devis",stock:"Stock",orders:"Commandes et livraisons",service:"Technique et SAV",planning:"Planning du staff",hr:"Dossier RH",accounting:"Comptabilité",dashboard:"Tableau de bord",
role_direction:"Direction",role_commercial:"Commercial",role_stock:"Stock",role_orders:"Commandes et livraisons",role_tech:"Technique et SAV",role_planning:"Planning du staff",role_hr:"RH",role_accounting:"Comptabilité",role_staff:"Staff",
login:"Entrer",name:"Votre nom",role:"Votre rôle",add:"Ajouter",edit:"Modifier",save:"Enregistrer",cancel:"Annuler",alerts:"Alertes du jour",none:"Rien à signaler.",lang:"English",search:"Rechercher…",print:"Imprimer / PDF",toorder:"Créer la commande",logout:"Changer de rôle",
demo:"Mode démonstration : les données restent sur cet appareil et ne sont pas partagées. La base commune sera branchée ensuite."},
en:{home:"Home",back:"Back",clients:"Clients to contact",quotes:"Quotes",stock:"Stock",orders:"Orders & deliveries",service:"Technical & after-sales",planning:"Staff planning",hr:"HR files",accounting:"Accounting",dashboard:"Dashboard",
role_direction:"Management",role_commercial:"Sales",role_stock:"Stock",role_orders:"Orders & deliveries",role_tech:"Technical & after-sales",role_planning:"Staff planning",role_hr:"HR",role_accounting:"Accounting",role_staff:"Staff",
login:"Enter",name:"Your name",role:"Your role",add:"Add",edit:"Edit",save:"Save",cancel:"Cancel",alerts:"Today's alerts",none:"Nothing to report.",lang:"Français",search:"Search…",print:"Print / PDF",toorder:"Create order",logout:"Switch role",
demo:"Demo mode: data stays on this device and is not shared. The shared database will be connected next."}};
const t=k=>(T[LANG]&&T[LANG][k])||T.fr[k]||"";
const ROLES=["direction","commercial","stock","orders","tech","planning","hr","accounting","staff"];
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
/* ===== Droits (copie côté écran ; la vraie protection = Supabase RLS) ===== */
const VIEW={clients:["direction","commercial"],quotes:["direction","commercial","accounting"],stock:["direction","commercial","stock","orders"],orders:["direction","commercial","stock","orders","accounting"],service:["direction","tech","orders"],planning:ROLES,hr:["direction","hr"],accounting:["direction","accounting"],dashboard:["direction"]};
const EDIT={clients:["direction","commercial"],quotes:["direction","commercial"],stock:["direction","stock"],orders:["direction","orders","commercial"],service:["direction","tech"],planning:["direction","planning"],hr:["direction","hr"],accounting:["direction","accounting"]};
const PG={clients:"clients",quotes:"quotes",stock:"stock",orders:"orders",service:"service",planning:"planning",hr:"hr",invoices:"accounting"};
const SEE_COST=["direction","accounting"];
const PAGES=["clients","quotes","stock","orders","service","planning","hr","accounting","dashboard"];
const CURS=["SAR","EUR","AED"];
let ME=null;try{const m=JSON.parse(sessionStorage.getItem("beme_me"));if(m&&typeof m.name==="string"&&ROLES.includes(m.role))ME={name:m.name.slice(0,60),role:m.role}}catch(e){}
const can=(act,p)=>!!ME&&own(act==="view"?VIEW:EDIT,p)&&(act==="view"?VIEW:EDIT)[p].includes(ME.role);
/* ===== Dates locales ===== */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parseD(s)||new Date();d.setDate(d.getDate()+n);return ymd(d)};
const daysTo=s=>{const d=parseD(s);if(!d)return null;const n=parseD(today());return Math.round((d-n)/864e5)};
const fmtD=s=>{const d=parseD(s);return d?d.toLocaleDateString(LANG==="fr"?"fr-FR":"en-GB",{day:"numeric",month:"short",year:"numeric"}):""};
/* ===== Données ===== */
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const IDRE=/^[a-z0-9-]{1,40}$/;
function seed(){const d=today();return{fx:{SAR:1,EUR:4.1,AED:1.02},qseq:0,
clients:[{id:uid(),name:"Hotel bakery (demo)",contact:"Procurement",phone:"",city:"Riyadh",status:"prospect",next:d,notes:""}],
quotes:[],stock:[
{id:uid(),ref:"EX-001",brand:"Bongard",name:"Rotary oven (demo)",cond:"new",status:"in_stock",avail:"riyadh",price:85000,cost:62000,cur:"SAR",qty:1,serial:"",loc:"Riyadh warehouse",photo:""},
{id:uid(),ref:"EX-002",brand:"Bongard",name:"Spiral mixer 80L (demo)",cond:"used",status:"in_transit",avail:"dubai",price:9000,cost:6500,cur:"EUR",qty:2,serial:"SN-0042",loc:"Dubai hub",photo:""}],
orders:[],service:[],planning:[],hr:[],invoices:[]}}
const ENUMS={stock:{cond:"cond",status:"status",avail:"avail"},clients:{status:"cstatus"},quotes:{status:"qstatus"},orders:{stage:"stage"},service:{type:"stype",status:"sstatus"},invoices:{kind:"kind"}};
const CURCOLL=["stock","quotes","orders","invoices"];
function sanitize(d){
 if(!d||typeof d!=="object")return null;
 const out={fx:{SAR:1,EUR:4.1,AED:1.02},qseq:Math.max(0,parseInt(d.qseq)||0)};
 ["EUR","AED"].forEach(c=>{const v=+(d.fx&&d.fx[c]);if(v>0&&isFinite(v))out.fx[c]=v});
 ["clients","quotes","stock","orders","service","planning","hr","invoices"].forEach(k=>{
  out[k]=(Array.isArray(d[k])?d[k]:[]).filter(r=>r&&typeof r==="object"&&IDRE.test(String(r.id))).map(r=>{
   const o=Object.fromEntries(Object.entries(r).filter(([a])=>a!=="__proto__"&&a!=="constructor"));
   if(ENUMS[k])Object.entries(ENUMS[k]).forEach(([f,g])=>{if(!own(OPT[g],o[f]))o[f]=Object.keys(OPT[g])[0]});
   if(CURCOLL.includes(k)&&!CURS.includes(o.cur))o.cur="SAR";
   if(k==="quotes"){o.items=(Array.isArray(o.items)?o.items:[]).map(i=>({stock:IDRE.test(String(i&&i.stock))?i.stock:"",desc:String(i&&i.desc||""),qty:+(i&&i.qty)||0,price:+(i&&i.price)||0}));o.vat=+o.vat||0}
   return o})});
 return out}
/* ===== Libellés des listes ===== */
const OPT={
cond:{new:{fr:"Neuf",en:"New"},used:{fr:"Occasion",en:"Used"}},
status:{in_stock:{fr:"En stock",en:"In stock"},reserved:{fr:"Réservé",en:"Reserved"},in_transit:{fr:"En transit",en:"In transit"}},
avail:{riyadh:{fr:"Disponible à Riyad",en:"Available in Riyadh"},dubai:{fr:"Disponible à Dubaï",en:"Available in Dubai"},toorder:{fr:"À commander",en:"To order"}},
cstatus:{prospect:{fr:"Prospect",en:"Prospect"},client:{fr:"Client",en:"Client"}},
qstatus:{draft:{fr:"Brouillon",en:"Draft"},sent:{fr:"Envoyé",en:"Sent"},accepted:{fr:"Accepté",en:"Accepted"},refused:{fr:"Refusé",en:"Refused"}},
stage:{ordered:{fr:"Commandé",en:"Ordered"},transit:{fr:"En transit",en:"In transit"},delivered:{fr:"Livré",en:"Delivered"},installed:{fr:"Installé",en:"Installed"}},
stype:{install:{fr:"Installation",en:"Installation"},sav:{fr:"SAV",en:"After-sales"}},
sstatus:{open:{fr:"À faire",en:"To do"},done:{fr:"Terminé",en:"Done"}},
kind:{customer:{fr:"Facture client",en:"Customer invoice"},supplier:{fr:"Facture fournisseur",en:"Supplier invoice"}},
cur:{SAR:{fr:"SAR",en:"SAR"},EUR:{fr:"EUR",en:"EUR"},AED:{fr:"AED",en:"AED"}}};
let DB;try{DB=sanitize(JSON.parse(localStorage.getItem("beme_db")))}catch(e){DB=null}
if(!DB){const raw=localStorage.getItem("beme_db");if(raw){try{localStorage.setItem("beme_db_corrupt_"+Date.now(),raw)}catch(e){}}DB=sanitize(seed())}
/* ===== Utilitaires ===== */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const lab=(g,v)=>esc(own(OPT,g)&&own(OPT[g],v)?OPT[g][v][LANG]:v);
const opts=g=>Object.keys(OPT[g]).map(k=>[k,OPT[g][k][LANG]]);
const rate=c=>(DB.fx[CURS.includes(c)?c:"SAR"])||1;
const toSAR=(a,c)=>(+a||0)*rate(c);
const money=(a,c)=>(+a||0).toLocaleString("en-US",{maximumFractionDigits:2})+" "+esc(CURS.includes(c)?c:"SAR");
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}
function persist(){try{localStorage.setItem("beme_db",JSON.stringify(DB));return true}catch(e){toast(L("Stockage plein : modification NON enregistrée. Exportez une sauvegarde et supprimez des photos.","Storage full: change NOT saved. Export a backup and remove some photos."));return false}}
const guard=p=>{if(!can("edit",p)){toast(L("Action non autorisée pour ce rôle.","Action not allowed for this role."));return false}return true};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const m=document.querySelectorAll(".modal");if(m.length)m[m.length-1].remove()}});
/* ===== Formulaire générique ===== */
function form(title,fields,vals,onSave){
 const m=document.createElement("div");m.className="modal";
 const v=Object.assign({},vals);
 let h=`<div class="box"><h3>${esc(title)}</h3><form id="f" novalidate>`;
 fields.forEach(f=>{
  h+=`<label>${esc(f.label)}${f.req?" *":""}</label>`;
  if(f.type==="select")h+=`<select name="${f.k}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${v[f.k]==o[0]?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
  else if(f.type==="textarea")h+=`<textarea name="${f.k}" rows="3">${esc(v[f.k]||"")}</textarea>`;
  else if(f.type==="file")h+=`<input type="file" name="${f.k}" accept="image/*" capture="environment">${v[f.k]?`<img class="thumb" alt="" src="${esc(v[f.k])}" style="margin-top:6px">`:""}`;
  else if(f.type==="number")h+=`<input name="${f.k}" type="number" step="any" min="0" inputmode="decimal" value="${esc(v[f.k]==null?"":v[f.k])}">`;
  else h+=`<input name="${f.k}" type="${f.type||"text"}" value="${esc(v[f.k]==null?"":v[f.k])}">`;
 });
 h+=`<div class="foot"><button class="pri" type="submit">${t("save")}</button><button type="button" id="x">${t("cancel")}</button></div></form></div>`;
 m.innerHTML=h;document.body.appendChild(m);
 m.querySelector("#x").onclick=()=>m.remove();
 m.querySelector("#f").onsubmit=async e=>{e.preventDefault();const o=Object.assign({},vals);
  for(const f of fields){const el=e.target.elements[f.k];
   if(f.type==="file"){if(el.files[0])o[f.k]=await shrink(el.files[0]);continue}
   let val=f.type==="number"?(el.value===""?0:Math.max(0,+el.value||0)):el.value.trim();
   if(f.req&&!val){el.focus();toast(L("Champ obligatoire : ","Required: ")+f.label);return}
   o[f.k]=val}
  m.remove();onSave(o)};
}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,400/Math.max(i.width,i.height));const c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.7))};i.onerror=()=>res("");i.src=r.result};r.readAsDataURL(file)})}
function crud(coll,fields,title,rec){const p=PG[coll];if(!guard(p))return;form(title,fields,rec||{id:uid()},o=>{if(!guard(p))return;const a=DB[coll];const i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o);persist();render()})}
function remove(coll,id){const p=PG[coll];if(!guard(p))return;
 if(coll==="clients"&&DB.quotes.some(q=>q.client===id))return toast(L("Ce client a des devis : suppression impossible.","This client has quotes: cannot delete."));
 if(coll==="quotes"&&DB.orders.some(o=>o.quote===id))return toast(L("Ce devis a une commande : suppression impossible.","This quote has an order: cannot delete."));
 if(confirm(L("Supprimer ?","Delete?"))){DB[coll]=DB[coll].filter(x=>x.id!==id);persist();render()}}
const clientName=id=>{const c=DB.clients.find(x=>x.id===id);return c?c.name:"—"};
const clientOpts=()=>DB.clients.map(c=>[c.id,c.name]);
const Q=()=>(window.QS||"").toLowerCase();
const hay=o=>JSON.stringify(Object.assign({},o,{photo:"",cost:"",items:undefined,id:"",history:undefined})).toLowerCase();
const search=()=>`<input type="search" aria-label="${t("search")}" placeholder="${t("search")}" value="${esc(window.QS||"")}" oninput="window.QS=this.value;render(true)" style="margin-bottom:10px">`;
const empty=(fn,p)=>`<p class="lbl" style="padding:10px">${L("Rien ici pour l'instant.","Nothing here yet.")} ${fn&&can("edit",p)?`<button class="sm gold" onclick="${fn}">+ ${t("add")}</button>`:""}</p>`;
/* ===== Stock : réservé / disponible ===== */
function reserved(s){let r=0;DB.quotes.forEach(q=>{if(q.status!=="accepted")return;const o=DB.orders.find(x=>x.quote===q.id);if(o&&(o.stage==="delivered"||o.stage==="installed"))return;q.items.forEach(i=>{if(i.stock===s.id)r+=+i.qty||0})});return r}
const avail=s=>(+s.qty||0)-reserved(s);
/* ===== Alertes (dans l'application uniquement) ===== */
function alerts(){const a=[];
 if(can("view","clients"))DB.clients.forEach(c=>{const d=daysTo(c.next);if(c.next&&d!==null&&d<=0)a.push([d<0?"r":"o",`${L("Relance","Follow-up")} : ${c.name} (${fmtD(c.next)})`,"clients"])});
 if(can("view","quotes"))DB.quotes.forEach(q=>{const d=daysTo(q.valid);if(q.status==="sent"&&d!==null&&d<=3)a.push([d<0?"r":"o",`${L("Devis à relancer","Quote to chase")} : ${q.no} — ${clientName(q.client)} (${fmtD(q.valid)})`,"quotes"])});
 if(can("view","hr"))DB.hr.forEach(h=>{[["Iqama",h.iqama],[L("Contrat","Contract"),h.contract]].forEach(([k,d])=>{const n=daysTo(d);if(d&&n!==null&&n<=60)a.push([n<0?"r":"o",`${h.name} — ${k} : ${fmtD(d)} (${n}${L("j","d")})`,"hr"])})});
 if(can("view","accounting"))DB.invoices.forEach(i=>{const n=daysTo(i.due);if(!i.paid&&i.due&&n!==null&&n<=7)a.push([n<0?"r":"o",`${OPT.kind[i.kind][LANG]} ${i.party} — ${money(i.amount,i.cur).replace(/&[^;]+;/g,"")} (${fmtD(i.due)})`,"accounting"])});
 if(can("view","service"))DB.service.forEach(s=>{const n=daysTo(s.warranty);if(s.warranty&&n!==null&&n>=0&&n<=30)a.push(["o",`${L("Garantie bientôt finie","Warranty ending")} : ${clientName(s.client)} — ${s.equip}`,"service"]);const m=daysTo(s.date);if(s.status==="open"&&m!==null&&m<=0)a.push([m<0?"r":"o",`${L("Intervention à faire","Job to do")} : ${clientName(s.client)} — ${s.equip} (${fmtD(s.date)})`,"service"])});
 if(can("view","stock"))DB.stock.forEach(s=>{if(avail(s)<0)a.push(["r",`${L("Stock insuffisant","Over-sold")} : ${s.name} (${avail(s)})`,"stock"])});
 return a}
/* ===== Pages ===== */
const V={};
V.home=()=>{const al=alerts();
 return `<h2>${t("home")}</h2><p class="lbl">${esc(ME.name)} · ${t("role_"+ME.role)}</p>
 <div class="card"><h3>${t("alerts")}</h3>${al.length?al.map(x=>`<div class="alert ${x[0]==="r"?"r":""}" onclick="go('${x[2]}')">${esc(x[1])}</div>`).join(""):`<p class="lbl">${t("none")}</p>`}</div>
 <div class="grid">${PAGES.filter(p=>can("view",p)).map(p=>`<button class="tile" onclick="go('${p}')">${t(p)}</button>`).join("")}</div>
 <p class="note" style="margin-top:14px">${t("demo")}</p>`};
const head=(p,fn)=>`<div class="bar"><h2 style="flex:1">${t(p)}</h2>${fn&&can("edit",p)?`<button class="gold" onclick="${fn}">+ ${t("add")}</button>`:""}</div>`;
const acts=(coll,id,p,extra)=>can("edit",p)?`<div class="act">${extra||""}<button class="sm" onclick="E_${coll}('${esc(id)}')">${t("edit")}</button><button class="sm danger" aria-label="${L("Supprimer","Delete")}" onclick="remove('${coll}','${esc(id)}')">✕</button></div>`:"";
/* Clients */
const CF=()=>[{k:"name",label:L("Nom / société","Name / company"),req:1},{k:"contact",label:"Contact"},{k:"phone",label:L("Téléphone","Phone")},{k:"city",label:L("Ville","City")},{k:"status",label:L("Statut","Status"),type:"select",opts:opts("cstatus")},{k:"next",label:L("Prochaine relance","Next follow-up"),type:"date"},{k:"notes",label:L("Notes / historique","Notes / history"),type:"textarea"}];
window.A_clients=()=>crud("clients",CF(),t("add"));window.E_clients=id=>crud("clients",CF(),t("edit"),DB.clients.find(x=>x.id===id));
window.doneFollow=id=>{const c=DB.clients.find(x=>x.id===id);if(!guard("clients"))return;const n=prompt(L("Prochaine relance (AAAA-MM-JJ) :","Next follow-up (YYYY-MM-DD):"),addDays(today(),7));if(n===null)return;c.next=parseD(n)?n:"";persist();render()};
V.clients=()=>{const q=Q();const Ls=DB.clients.filter(c=>hay(c).includes(q)).sort((a,b)=>(a.next||"9")>(b.next||"9")?1:-1);

 return head("planning","A_planning()")+(Ls.length?`<div class="card tw"><table><tr><th>Date</th><th>${L("Personne","Person")}</th><th>${L("Mission","Task")}</th><th></th></tr>${Ls.map(p=>`<tr><td>${esc(fmtD(p.date))}</td><td>${esc(p.person)}</td><td>${esc(p.title)}</td><td>${acts("planning",p.id,"planning")}</td></tr>`).join("")}</table></div>`:empty("A_planning()","planning"))};
/* RH */
const HF=()=>[{k:"name",label:L("Nom","Name"),req:1},{k:"post",label:L("Poste","Position")},{k:"iqama",label:L("Expiration iqama","Iqama expiry"),type:"date"},{k:"contract",label:L("Fin de contrat","Contract end"),type:"date"},{k:"leave",label:L("Jours de congé restants","Leave days left"),type:"number"},{k:"notes",label:"Notes",type:"textarea"}];
window.A_hr=()=>crud("hr",HF(),t("add"));window.E_hr=id=>crud("hr",HF(),t("edit"),DB.hr.find(x=>x.id===id));
V.hr=()=>head("hr","A_hr()")+(DB.hr.length?`<div class="card tw"><table><tr><th>${L("Nom","Name")}</th><th>Iqama</th><th>${L("Contrat","Contract")}</th><th>${L("Congés","Leave")}</th><th></th></tr>${DB.hr.slice().sort((a,b)=>a.name>b.name?1:-1).map(h=>{const a=daysTo(h.iqama),b=daysTo(h.contract);return `<tr><td><b>${esc(h.name)}</b><br><span class="lbl">${esc(h.post)}</span></td><td>${h.iqama?`<span class="badge ${a<0?"r":a<=60?"o":"g"}">${esc(fmtD(h.iqama))}</span>`:""}</td><td>${h.contract?`<span class="badge ${b<0?"r":b<=60?"o":"g"}">${esc(fmtD(h.contract))}</span>`:""}</td><td>${esc(h.leave)}</td><td>${acts("hr",h.id,"hr")}</td></tr>`}).join("")}</table></div>`:empty("A_hr()","hr"));
/* Comptabilité */
const IF=()=>[{k:"kind",label:"Type",type:"select",opts:opts("kind")},{k:"party",label:L("Client / fournisseur","Client / supplier"),req:1},{k:"cur",label:L("Monnaie","Currency"),type:"select",opts:opts("cur")},{k:"amount",label:L("Montant","Amount"),type:"number"},{k:"issued",label:L("Date de facture","Issue date"),type:"date"},{k:"due",label:L("Échéance","Due date"),type:"date"},{k:"paid",label:L("Payée ?","Paid?"),type:"select",opts:[["",L("Non","No")],["1",L("Oui","Yes")]]}];
window.A_invoices=()=>crud("invoices",IF(),t("add"),{id:uid(),kind:"customer",cur:"SAR"});window.E_invoices=id=>crud("invoices",IF(),t("edit"),DB.invoices.find(x=>x.id===id));
V.accounting=()=>head("accounting","A_invoices()")+(DB.invoices.length?`<div class="card tw"><table><tr><th>Type</th><th>${L("Tiers","Party")}</th><th>${L("Montant","Amount")}</th><th>${L("Échéance","Due")}</th><th></th></tr>${DB.invoices.slice().sort((a,b)=>(!!a.paid-!!b.paid)||((a.due||"9")>(b.due||"9")?1:-1)).map(i=>{const n=daysTo(i.due);return `<tr><td><span class="badge">${lab("kind",i.kind)}</span></td><td>${esc(i.party)}</td><td>${money(i.amount,i.cur)}</td><td>${i.paid?`<span class="badge g">${L("Payée","Paid")}</span>`:i.due?`<span class="badge ${n<0?"r":n<=7?"o":""}">${esc(fmtD(i.due))}</span>`:""}</td><td>${acts("invoices",i.id,"accounting")}</td></tr>`}).join("")}</table></div>`:empty("A_invoices()","accounting"));
/* Tableau de bord (SAR + conversion) */
window.fxSet=(c,v)=>{if(ME.role!=="direction")return;const n=+v;if(!(n>0)||!isFinite(n)){toast(L("Taux invalide.","Invalid rate."));render();return}DB.fx[c]=n;persist();render()};
window.exportDB=()=>{if(ME.role!=="direction")return;const b=new Blob([JSON.stringify(DB)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="beme-backup-"+today()+".json";a.click();localStorage.setItem("beme_lastbackup",today())};
window.importDB=inp=>{if(ME.role!=="direction")return;const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=sanitize(JSON.parse(r.result));if(!d)throw 0;if(!confirm(L("Remplacer toutes les données par cette sauvegarde ?","Replace all data with this backup?")))return;DB=d;persist();render()}catch(e){toast(L("Fichier invalide.","Invalid file."))}};r.readAsText(f)};
window.resetDB=()=>{if(ME.role!=="direction")return;if(prompt(L("Tapez RESET pour effacer toutes les données :","Type RESET to erase all data:"))==="RESET"){DB=sanitize(seed());persist();render()}};
V.dashboard=()=>{
 const acc=DB.quotes.filter(q=>q.status==="accepted");const sales=acc.reduce((a,q)=>a+qSAR(q),0);
 const pipe=DB.quotes.filter(q=>q.status==="draft"||q.status==="sent").reduce((a,q)=>a+toSAR(qTotal(q),q.cur),0);
 const unpaid=DB.invoices.filter(i=>i.kind==="customer"&&!i.paid).reduce((a,i)=>a+toSAR(i.amount,i.cur),0);
 const onhand=DB.stock.filter(s=>s.avail!=="toorder"&&s.status!=="in_transit"),incoming=DB.stock.filter(s=>s.avail==="toorder"||s.status==="in_transit");
 const val=(a,f)=>a.reduce((x,s)=>x+toSAR(s[f],s.cur)*(+s.qty||0),0);
 const al=alerts();const lb=localStorage.getItem("beme_lastbackup");
 const conv=v=>`<span class="lbl">≈ ${(v/rate("EUR")).toLocaleString("en-US",{maximumFractionDigits:0})} EUR · ${(v/rate("AED")).toLocaleString("en-US",{maximumFractionDigits:0})} AED</span>`;
 const k=(l,v)=>`<div class="card"><div class="lbl">${l}</div><div class="kpi">${money(v,"SAR")}</div>${conv(v)}</div>`;
 const stg=Object.keys(OPT.stage).map(s=>`${OPT.stage[s][LANG]}: <b>${DB.orders.filter(o=>o.stage===s).length}</b>`).join(" · ");
 return `<div class="bar"><h2 style="flex:1">${t("dashboard")}</h2></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">
 ${k(L("Ventes (devis acceptés)","Sales (accepted quotes)"),sales)}
 ${k(L("Devis en cours (brouillon + envoyés)","Open quotes (draft + sent)"),pipe)}
 ${k(L("Impayés clients","Customer unpaid"),unpaid)}
 ${k(L("Stock sur place (valeur de vente)","On-hand stock (sale value)"),val(onhand,"price"))}
 ${k(L("Marge potentielle du stock sur place","Potential margin, on-hand stock"),val(onhand,"price")-val(onhand,"cost"))}
 ${k(L("Stock en transit / à commander","Incoming / to-order stock"),val(incoming,"price"))}
 <div class="card"><div class="lbl">${L("Alertes","Alerts")}</div><div class="kpi">${al.length}</div></div></div>
 <div class="card"><div class="lbl">${L("Commandes par étape","Orders by stage")}</div><p>${stg}</p></div>
 <div class="card"><h3>${L("Taux de conversion (modifiables)","Exchange rates (editable)")}</h3><p class="lbl">${L("1 unité = … SAR. À vérifier et mettre à jour par la Direction. Les devis acceptés gardent le taux du jour d'acceptation.","1 unit = … SAR. To be checked and updated by Management. Accepted quotes keep the rate of the day they were accepted.")}</p>
 <div class="row2"><div><label>1 EUR</label><input type="number" step="any" min="0.0001" inputmode="decimal" value="${esc(DB.fx.EUR)}" onchange="fxSet('EUR',this.value)"></div><div><label>1 AED</label><input type="number" step="any" min="0.0001" inputmode="decimal" value="${esc(DB.fx.AED)}" onchange="fxSet('AED',this.value)"></div></div></div>
 <div class="card"><h3>${L("Sauvegarde des données","Data backup")}</h3><p class="lbl">${L("Dernière sauvegarde : ","Last backup: ")}${lb?esc(fmtD(lb)):L("jamais","never")}</p>
 <div class="bar"><button onclick="exportDB()">${L("Exporter (JSON)","Export (JSON)")}</button><label class="btn" style="margin:0">${L("Importer","Import")}<input type="file" accept="application/json" style="display:none" onchange="importDB(this)"></label><button class="danger sm" onclick="resetDB()">${L("Tout effacer","Erase all")}</button></div></div>`};
/* ===== Navigation, connexion, rendu ===== */
let NAV=[];
window.go=p=>{window.QS="";location.hash="#"+p};
window.goBack=()=>{const prev=NAV.length>1?NAV[NAV.length-2]:"home";NAV.length=Math.max(NAV.length-2,0);go(prev)};
function render(keep){
 const app=$("#app");document.documentElement.lang=LANG;
 if(!ME){app.innerHTML=`<div class="login card"><img src="assets/beme-logo.png" alt="BEME"><h2 style="margin:10px 0">Management</h2>
  <label for="ln">${t("name")}</label><input id="ln" maxlength="60" autocomplete="name">
  <label for="lr">${t("role")}</label><select id="lr">${ROLES.map(r=>`<option value="${r}">${t("role_"+r)}</option>`).join("")}</select>
  <div class="bar" style="margin-top:14px;justify-content:center"><button class="pri" id="lgo">${t("login")}</button><button id="llang">${t("lang")}</button></div><p class="note">${t("demo")}</p></div>`;
  $("#lgo").onclick=()=>{const n=$("#ln").value.trim();if(!n){$("#ln").focus();return}ME={name:n,role:$("#lr").value};sessionStorage.setItem("beme_me",JSON.stringify(ME));NAV=[];render()};
  $("#llang").onclick=()=>{LANG=LANG==="fr"?"en":"fr";localStorage.setItem("beme_lang",LANG);render()};return}
 let p=location.hash.slice(1)||"home";if(!(p==="home"||(PAGES.includes(p)&&can("view",p))))p="home";
 if(NAV[NAV.length-1]!==p)NAV.push(p);
 const foc=keep&&document.activeElement&&document.activeElement.tagName==="INPUT"?document.activeElement.selectionStart:null;
 const home=p==="home";
 app.innerHTML=`<header><img src="assets/beme-logo.png" alt="BEME"><button class="sm" ${home?"disabled":""} onclick="goBack()">← ${t("back")}</button><button class="sm pri" ${home?"disabled":""} onclick="go('home')">⌂ ${t("home")}</button><span class="sp"></span><button class="sm" onclick="LANG=LANG==='fr'?'en':'fr';localStorage.setItem('beme_lang',LANG);render()">${t("lang")}</button><button class="sm" onclick="ME=null;NAV=[];sessionStorage.removeItem('beme_me');render()">${t("logout")}</button></header><main>${V[p]()}</main>`;
 if(foc!==null){const i=document.querySelector("main input[type=search]");if(i){i.focus();i.setSelectionRange(foc,foc)}}
}
window.addEventListener("hashchange",()=>render());
render();
</script>
</body>
</html>
