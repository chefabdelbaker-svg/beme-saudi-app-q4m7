const pinHash=async(id,p)=>{const d=id+":beme-ksa:"+p;try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(d));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}}catch(e){}let h=0x811c9dc5,o="";for(let k=0;k<8;k++){for(let i=0;i<d.length;i++){h^=d.charCodeAt(i)+k;h=Math.imul(h,16777619)>>>0}o+=h.toString(16).padStart(8,"0")}return(o+o).slice(0,64)};
