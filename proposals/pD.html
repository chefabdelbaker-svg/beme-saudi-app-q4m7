 cards.forEach((c,i)=>{const on=i===sel;c.head.setAttribute('aria-expanded',on);c.head.tabIndex=0;
  c.body.querySelectorAll('button').forEach(b=>b.tabIndex=on?0:-1);
  c.body.setAttribute('aria-hidden',!on);c.el.querySelector('.halo').style.setProperty('--m',wallet.style.getPropertyValue('--m'))});
}
function open(i){
 if(i===sel)return;sel=i;layout();
 setTimeout(()=>{if(sel===i)cards[i].el.querySelector('.enter').focus({preventScroll:true})},420)}
function close(){
 if(sel<0)return;const i=sel;sel=-1;layout();cards[i].head.focus({preventScroll:true})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sheet').classList.contains('on'))closeSheet();else close()}});
function tr(){const L=T[lang];
 document.documentElement.lang=lang;
 $('#sub').textContent=L.sub;$('#by').textContent=L.by;$('#sh').textContent=L.sh;$('#xs').setAttribute('aria-label',L.close);
 $('#wl').textContent=L.lbl;wallet.setAttribute('aria-label',L.lbl);
 secs.forEach((s,i)=>s.firstChild.textContent=L.secs[i]);
 cards.forEach((c,i)=>{const p=P[i],w=lang==='fr'?p.w:p.wen,e=c.el;
  e.querySelector('.head .t').textContent=p[lang];e.querySelector('.head .w').textContent=w;
  e.querySelector('.head').setAttribute('aria-label',p[lang]+' — '+w);
  e.querySelector('.role').textContent=p[lang];e.querySelector('.who').textContent=w;
  e.querySelector('.enter').textContent=L.enter;e.querySelector('.enter').setAttribute('aria-label',L.enter+' — '+p[lang]);
  e.querySelector('.back span').textContent=L.back;e.querySelector('.back').setAttribute('aria-label',L.backl)});
 if(sel>=0)$('#sp').textContent=L.sp+P[sel][lang];
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang))}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;tr()});
const sheet=$('#sheet'),toast=$('#toast');let lastFocus;
function openSheet(){lastFocus=document.activeElement;$('#sp').textContent=T[lang].sp+P[sel][lang];sheet.classList.add('on');setTimeout(()=>$('#code').focus({preventScroll:true}),400)}
function closeSheet(){sheet.classList.remove('on');if(lastFocus)lastFocus.focus({preventScroll:true})}
$('#xs').onclick=closeSheet;
$('#form').onsubmit=e=>{e.preventDefault();const nm=P[sel][lang];sheet.classList.remove('on');toast.textContent=T[lang].toast+nm;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),2200);$('#code').value=''};
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(layout,60)});
tr();
cards.forEach(c=>c.el.style.transition='none');layout();
requestAnimationFrame(()=>requestAnimationFrame(()=>cards.forEach(c=>c.el.style.transition='')));
</script>
</body>
</html>
