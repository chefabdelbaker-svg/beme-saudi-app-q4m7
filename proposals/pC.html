<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>BEME KSA — Proposition C · Roue d'honneur</title>
<style>
:root{--gold:#BF9F5F;--gold2:#d9c28f;--gold3:#8f7433;--ink:#0b0b0b;--paper:#f3ede0;--dim:rgba(243,237,224,.72);
--serif:"Playfair Display","Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--S:min(92vw,372px);--med:52px;--R:calc(var(--S)/2 - var(--med)/2 - 2px);--dur:.75s;--ease:cubic-bezier(.22,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:var(--paper);font-family:var(--sans);overflow-x:hidden}
body{min-height:100dvh;position:relative}
.bg{position:fixed;inset:0;z-index:0;background:
 radial-gradient(ellipse 80% 55% at 50% 52%,rgba(191,159,95,.20),transparent 70%),
 linear-gradient(180deg,rgba(11,11,11,.92) 0%,rgba(11,11,11,.72) 38%,rgba(11,11,11,.9) 80%,#0b0b0b 100%),
 url(../assets/img/riyadh-night.webp) center 30%/cover no-repeat,#0b0b0b}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65) 100%)}
.page{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
header{width:100%;max-width:1100px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start}
.brand{grid-column:2;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand img.logo{height:62px;width:auto;display:block;filter:drop-shadow(0 0 14px rgba(191,159,95,.35))}
.brand h1{font:400 15px/1 var(--serif);letter-spacing:.42em;text-indent:.42em;color:var(--paper);margin-top:6px}
.brand .sub{font-size:9px;letter-spacing:.5em;text-indent:.5em;color:var(--gold);margin-top:6px;font-weight:600}
.rule{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--gold3)}
.rule i{display:block;width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule i:last-child{transform:scaleX(-1)}
.rule b{width:5px;height:5px;transform:rotate(45deg);background:var(--gold)}
.lang{grid-column:3;justify-self:end;display:flex;gap:4px;margin:-4px -6px 0 0}
.lang button{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:50%;cursor:pointer;opacity:.55;transition:opacity .3s,transform .3s}
.lang button svg{width:26px;height:18px;border-radius:3px;outline:1px solid rgba(191,159,95,.55);outline-offset:1px;display:block}
.lang button[aria-pressed=true]{opacity:1}
.lang button[aria-pressed=true] svg{outline:1.5px solid var(--gold2);box-shadow:0 0 10px rgba(191,159,95,.5)}
.lang button:hover{opacity:.9}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px;border-radius:6px}
main{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:0;padding:6px 0}
.stage{position:relative;width:var(--S);height:var(--S);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.stage.drag{cursor:grabbing}
.track{position:absolute;inset:calc(var(--med)/2 + 2px);border-radius:50%;border:1px solid rgba(191,159,95,.28);box-shadow:0 0 0 6px rgba(191,159,95,.04),inset 0 0 60px rgba(191,159,95,.07)}
.track.t2{inset:calc(var(--med)/2 + 12px);border:1px dashed rgba(191,159,95,.16);box-shadow:none}
.ring{position:absolute;inset:0;transition:transform var(--dur) var(--ease);will-change:transform}
.stage.drag .ring,.stage.drag .ring .ctr{transition:none}
.slot{position:absolute;left:50%;top:50%;width:0;height:0}
.slot .arm{position:absolute;left:0;top:0;width:0;height:0}
.med{position:absolute;left:calc(var(--med)/-2);top:calc(var(--med)/-2);width:var(--med);height:var(--med);border-radius:50%;
 border:1.2px solid var(--gold3);color:var(--gold);cursor:pointer;display:grid;place-items:center;
 background:radial-gradient(circle at 32% 28%,rgba(217,194,143,.20),rgba(20,17,10,.92) 62%);
 box-shadow:0 4px 14px rgba(0,0,0,.6),inset 0 0 0 3px rgba(11,11,11,.7),inset 0 0 0 3.8px rgba(191,159,95,.22);
 transition:transform var(--dur) var(--ease),opacity .5s,border-color .4s,color .4s,background .4s,box-shadow .5s;opacity:.82}
.med svg{width:48%;height:48%;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.med:hover{opacity:1;border-color:var(--gold)}
.med[aria-checked=true]{opacity:1;color:#1a1409;border-color:var(--gold2);
 background:radial-gradient(circle at 32% 26%,#f0dfb4,var(--gold) 55%,var(--gold3));
 box-shadow:0 0 0 4px rgba(191,159,95,.18),0 0 26px rgba(217,194,143,.55),0 6px 18px rgba(0,0,0,.6)}
.lbl{position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;color:var(--dim);display:none;pointer-events:none;transition:color .4s}
.med[aria-checked=true] .lbl{opacity:0}
.ctr{position:absolute;left:50%;top:50%;width:0;height:0}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--S) - var(--med)*2 - 34px);display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none}
.halo{position:relative;width:96px;height:96px;display:grid;place-items:center;margin-bottom:6px}
.halo::before,.halo::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(217,194,143,.35);animation:pulse 3.6s ease-out infinite}
.halo::after{animation-delay:1.8s}
.halo .glow{position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,rgba(191,159,95,.38),transparent 68%);animation:breathe 4.5s ease-in-out infinite}
.halo .disc{position:relative;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:var(--gold2);
 background:radial-gradient(circle at 50% 35%,rgba(217,194,143,.16),rgba(11,11,11,.85) 70%);border:1.5px solid var(--gold);
 box-shadow:inset 0 0 0 5px rgba(11,11,11,.8),inset 0 0 0 6px rgba(191,159,95,.35),0 0 30px rgba(191,159,95,.25)}
.halo svg{width:46%;height:46%;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(.95)}50%{opacity:1;transform:scale(1.06)}}
.swap{transition:opacity .28s ease,transform .28s ease}
.swap.out{opacity:0;transform:translateY(4px)}
.role{font:400 21px/1.1 var(--serif);color:var(--paper);letter-spacing:.03em}
.who{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-top:7px;font-weight:600}
.actions{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:2px}
.enter{min-height:48px;min-width:176px;padding:0 30px;border:0;border-radius:999px;cursor:pointer;font:600 12px var(--sans);letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:#1a1409;
 background:linear-gradient(135deg,#e8d5a3,var(--gold) 45%,var(--gold3));box-shadow:0 8px 24px rgba(191,159,95,.28),inset 0 1px 0 rgba(255,255,255,.45);position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.enter::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.enter:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(191,159,95,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.enter:active{transform:scale(.97)}
.hint{text-align:center;padding:0 8px;font-size:11px;letter-spacing:.12em;color:rgba(243,237,224,.55);min-height:14px}
footer{margin-top:4px;display:flex;align-items:center;gap:10px;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(243,237,224,.5)}
footer img{height:15px;width:auto;filter:brightness(0) invert(1);opacity:.55}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:0 12px max(12px,env(safe-area-inset-bottom));transform:translateY(120%);transition:transform .5s var(--ease);pointer-events:none}
.sheet.on{transform:none;pointer-events:auto}
.sheet form{width:100%;max-width:420px;background:linear-gradient(180deg,#17130b,#0e0c08);border:1px solid var(--gold3);border-radius:18px;padding:18px 18px 16px;box-shadow:0 -10px 50px rgba(0,0,0,.7),0 0 40px rgba(191,159,95,.12)}
.sheet h2{font:400 18px var(--serif);color:var(--gold2);letter-spacing:.04em}
.sheet p{font-size:12px;color:var(--dim);margin:4px 0 12px}
.sheet .row{display:flex;gap:8px}
.sheet input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--gold3);background:rgba(0,0,0,.5);color:var(--paper);font-size:20px;letter-spacing:.5em;text-align:center;padding:0 10px}
.sheet input:focus{outline:2px solid var(--gold2);border-color:var(--gold2)}
.sheet .go{width:60px;height:48px;border:0;border-radius:12px;background:var(--gold);color:#1a1409;font-size:20px;cursor:pointer}
.sheet .x{position:absolute;right:20px;top:8px;width:44px;height:44px;background:none;border:0;color:var(--dim);font-size:22px;cursor:pointer}
.sheet form{position:relative}
.toast{opacity:0;position:fixed;top:14px;left:50%;transform:translate(-50%,-150%);z-index:6;background:#17130b;border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:12px 22px;font-size:13px;transition:transform .45s var(--ease),opacity .3s;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.toast.on{transform:translate(-50%,0);opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 1px 1px)}
@media (max-width:899px){.role{font-size:19px}.who{font-size:10px;letter-spacing:.2em}.halo{width:88px;height:88px}}
@media (min-height:860px) and (max-width:700px){:root{--S:min(92vw,400px);--med:56px}.halo{width:108px;height:108px}.role{font-size:24px}}
/* ===== Laptop : demi-cercle large ===== */
@media (min-width:900px){
 :root{--med:64px;--W:min(1000px,94vw);--Rl:min(400px,calc(var(--W)/2 - 70px));--top:56px}
 .brand img.logo{height:66px}
 .stage{width:var(--W);height:calc(var(--top) + var(--Rl) + var(--med) + 34px);overflow:hidden;--S:calc(var(--Rl)*2 + var(--med))}
 .stage .ring{inset:auto;position:absolute;left:50%;top:var(--top);width:var(--S);height:var(--S);margin-left:calc(var(--S)/-2)}
 .stage .track{inset:auto;position:absolute;left:50%;top:calc(var(--top) + var(--med)/2);width:calc(var(--Rl)*2);height:calc(var(--Rl)*2);margin-left:calc(var(--Rl)*-1)}
 .stage .track.t2{top:calc(var(--top) + var(--med)/2 + 22px);width:calc(var(--Rl)*2 - 44px);height:calc(var(--Rl)*2 - 44px);margin-left:calc(var(--Rl)*-1 + 22px)}
 .lbl{display:block}
 .center{left:50%;top:calc(var(--top) + var(--med)/2 + var(--Rl)*.3);transform:translate(-50%,0);width:380px}
 .halo{width:112px;height:112px;margin-bottom:10px}
 .role{font-size:34px}
 .who{font-size:12px}
 .actions{margin-top:calc((var(--Rl) + var(--med) + 34px - var(--Rl)*.3 - var(--med)/2) * -.34 - 20px);position:relative;z-index:2}
 main{gap:0}
}
@media (min-width:900px) and (max-height:780px){
 :root{--Rl:min(310px,calc(var(--W)/2 - 70px));--med:56px;--top:46px}
 .brand img.logo{height:52px}.halo{width:92px;height:92px;margin-bottom:6px}.role{font-size:28px}
}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
@media (max-width:340px){.brand h1{letter-spacing:.3em}.enter{min-width:150px;padding:0 20px}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="page">
 <header>
  <div class="brand">
   <img class="logo" src="../assets/beme-logo-white.svg" alt="BEME">
   <h1>BEME KSA</h1>
   <div class="sub" id="sub">OPÉRATIONS</div>
   <div class="rule" aria-hidden="true"><i></i><b></b><i></i></div>
  </div>
  <div class="lang" role="group" aria-label="Langue / Language">
   <button type="button" data-l="fr" aria-pressed="true" aria-label="Français"><svg viewBox="0 0 30 20" aria-hidden="true"><rect width="10" height="20" fill="#e8d5a3"/><rect x="10" width="10" height="20" fill="#f3ede0"/><rect x="20" width="10" height="20" fill="#8f7433"/></svg></button>
   <button type="button" data-l="en" aria-pressed="false" aria-label="English"><svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#2a2214"/><path d="M0 0 30 20M30 0 0 20" stroke="#8f7433" stroke-width="3.2"/><path d="M0 0 30 20M30 0 0 20" stroke="#e8d5a3" stroke-width="1"/><path d="M15 0v20M0 10h30" stroke="#f3ede0" stroke-width="6"/><path d="M15 0v20M0 10h30" stroke="#BF9F5F" stroke-width="3.4"/></svg></button>
  </div>
 </header>
 <main>
  <div class="stage" id="stage">
   <div class="track"></div><div class="track t2"></div>
   <div class="ring" id="ring" role="radiogroup" aria-labelledby="rg"></div>
   <div class="center" aria-live="polite">
    <div class="halo"><span class="glow"></span><span class="disc"><svg id="cico" viewBox="0 0 24 24" aria-hidden="true"></svg></span></div>
    <div class="swap" id="cinfo"><div class="role" id="crole"></div><div class="who" id="cwho"></div></div>
   </div>
  </div>
  <span id="rg" class="sr"></span>
  <div class="actions">
   <button class="enter" id="enter" type="button"></button>
   <div class="hint" id="hint"></div>
  </div>
 </main>
 <footer><span id="by">Un partenaire de</span><img src="../assets/img/bongard-logo.png" alt="Bongard"></footer>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh">
 <form id="form"><button type="button" class="x" id="xs" aria-label="Fermer">&times;</button>
  <h2 id="sh"></h2><p id="sp"></p>
  <div class="row"><input id="code" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="Code"><button class="go" aria-label="OK">&rarr;</button></div>
 </form>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const AIC={crown:'<path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/>',gem:'<path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/>',hand:'<path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/>',link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',compass:'<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z"/>',plan:'<path d="M4 4h16v16H4z"/><path d="M4 10h7M11 4v6M11 15h9M15 15v5"/>',target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',doc:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"/>',money:'<rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>',box:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>',wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',cal:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'};
const P=[
 {k:'crown',fr:'CEO',en:'CEO',w:'Rachid',wen:'Rachid'},
 {k:'gem',fr:'Partner',en:'Partner',w:'Abdelhafid',wen:'Abdelhafid'},
 {k:'compass',fr:'General Manager',en:'General Manager',w:'Direction',wen:'Management'},
 {k:'plan',fr:'Operations Manager',en:'Operations Manager',w:'Commandes et livraisons',wen:'Orders & deliveries'},
 {k:'target',fr:'Sales Manager',en:'Sales Manager',w:'Commercial',wen:'Sales'},
 {k:'doc',fr:'HR',en:'HR',w:'RH',wen:'Human resources'},
 {k:'money',fr:'Accounting',en:'Accounting',w:'Comptabilité',wen:'Finance'}];
const T={fr:{sub:'OPÉRATIONS',enter:'Entrer',hint:'Faites tourner la roue ou touchez un médaillon',by:'Un partenaire de',sh:'Code d’accès',sp:'Saisissez votre code pour entrer en tant que ',toast:'Profil sélectionné : ',close:'Fermer',lbl:'Choix du profil'},
 en:{sub:'OPERATIONS',enter:'Enter',hint:'Spin the wheel or tap a medallion',by:'A partner of',sh:'Access code',sp:'Enter your code to sign in as ',toast:'Profile selected: ',close:'Close',lbl:'Profile selection'}};
const N=P.length,STEP=360/N;
const $=s=>document.querySelector(s),ring=$('#ring'),stage=$('#stage');
const ico=k=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+AIC[k]+'</svg>';
let lang='fr',idx=0,rot=0;
const wide=()=>matchMedia('(min-width:900px)').matches;
const items=P.map((p,i)=>{
 const slot=document.createElement('div');slot.className='slot';
 const arm=document.createElement('div');arm.className='arm';
 const b=document.createElement('button');b.type='button';b.className='med';b.setAttribute('role','radio');
 b.innerHTML=ico(p.k)+'<span class="lbl"></span>';
 b.addEventListener('click',()=>{if(moved)return;go(i)});
 b.addEventListener('keydown',e=>{
  const d={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];
  if(d){e.preventDefault();go(idx+d,true)}
  else if(e.key==='Home'){e.preventDefault();go(0,true)}
  else if(e.key==='End'){e.preventDefault();go(N-1,true)}});
 arm.appendChild(b);slot.appendChild(arm);ring.appendChild(slot);return {slot,arm,b,a:i*STEP}});
function R(){return wide()?parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--Rl'))||0:0}
function radius(){const s=ring.getBoundingClientRect(),w=ring.offsetWidth,m=items[0].b.offsetWidth;return w/2-m/2-2}
function geo(){return wide()?{step:30,per:210}:{step:STEP,per:360}}
function place(r,rot){
 const g=geo();
 items.forEach((it,i)=>{
  let w=((i*g.step+rot)%g.per+g.per*1.5)%g.per-g.per/2; // (-per/2, per/2]
  it.net=w;
  it.slot.style.transform='rotate('+(w-rot)+'deg)';
  it.arm.style.transform='translateY('+(-r)+'px) rotate('+(-w)+'deg)';
 });
}
function layout(){
 const r=radius(),g=geo();
 ring.style.transform='rotate('+rot+'deg)';
 place(r,rot);
 items.forEach((it,i)=>{
  const rel=it.net;
  const far=wide()&&Math.abs(rel)>96;
  it.b.style.opacity=far?0:'';
  it.b.style.pointerEvents=far?'none':'';
  const act=i===idx;
  it.b.style.transform=act?'scale('+(wide()?1.2:1.16)+')':'scale('+(1-Math.min(Math.abs(rel),120)/700)+')';
  it.b.setAttribute('aria-checked',act);it.b.tabIndex=act?0:-1;
 });
}
function setText(first){
 const p=P[idx],L=T[lang];
 const apply=()=>{
  $('#cico').innerHTML=AIC[p.k];
  $('#crole').textContent=p[lang];$('#cwho').textContent=lang==='fr'?p.w:p.wen;
  $('#cinfo').classList.remove('out')};
 if(first){apply();return}
 $('#cinfo').classList.add('out');setTimeout(apply,220)}
function go(i,focus){
 // shortest path
 let target=((i%N)+N)%N,d=target-idx;
 if(d>N/2)d-=N;if(d<-N/2)d+=N;
 const steps=(i!==idx&&Math.abs(i-idx)<=N/2&&!focus)?d:d;
 idx=target;rot-=d*geo().step;
 setText();layout();
 if(focus)items[idx].b.focus({preventScroll:true});
 hintOnce()}
let hid;function hintOnce(){}
function tr(){const L=T[lang];
 document.documentElement.lang=lang;
 $('#sub').textContent=L.sub;$('#enter').textContent=L.enter;$('#hint').textContent=L.hint;$('#by').textContent=L.by;
 $('#sh').textContent=L.sh;$('#xs').setAttribute('aria-label',L.close);ring.setAttribute('aria-label',L.lbl);$('#rg').textContent=L.lbl;
 items.forEach((it,i)=>{it.b.setAttribute('aria-label',P[i][lang]+' — '+(lang==='fr'?P[i].w:P[i].wen));it.b.querySelector('.lbl').textContent=P[i][lang]});
 $('#sp').textContent=L.sp+P[idx][lang];
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang))}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;tr();setText(true)});
/* drag to rotate */
let drag=null,moved=false;
function ang(e){const r=stage.getBoundingClientRect(),c=ring.getBoundingClientRect();
 const cx=c.left+c.width/2,cy=c.top+c.height/2;return Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI}
stage.addEventListener('pointerdown',e=>{
 if(e.button>0)return;drag={a:ang(e),rot0:rot,x:e.clientX,id:e.pointerId};moved=false});
stage.addEventListener('pointermove',e=>{
 if(!drag)return;
 if(!moved&&Math.hypot(e.clientX-drag.x,0)<6&&Math.abs(ang(e)-drag.a)<3)return;
 if(!moved){moved=true;stage.classList.add('drag');stage.setPointerCapture(drag.id);
  items.forEach(it=>it.arm.style.transition='none')}
 let d=ang(e)-drag.a;if(d>180)d-=360;if(d<-180)d+=360;
 rot=drag.rot0+d;
 const rr=radius();
 ring.style.transform='rotate('+rot+'deg)';
 place(rr,rot);
 const n=Math.round(-rot/geo().step),t=((n%N)+N)%N;
 if(t!==idx){idx=t;items.forEach((it,i)=>{it.b.setAttribute('aria-checked',i===idx);it.b.style.transform=i===idx?'scale(1.16)':''});setText()}});
function end(){
 if(!drag)return;const was=moved;drag=null;stage.classList.remove('drag');
 if(was){const n=Math.round(-rot/geo().step);rot=-n*geo().step;idx=((n%N)+N)%N;layout();setText();tr()}
 setTimeout(()=>moved=false,0)}
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
/* wheel scroll on laptop */
stage.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)+Math.abs(e.deltaY)<12)return;e.preventDefault();
 if(stage._w)return;stage._w=1;setTimeout(()=>stage._w=0,350);go(idx+((e.deltaY+e.deltaX)>0?1:-1))},{passive:false});
/* enter */
const sheet=$('#sheet'),toast=$('#toast');
function openSheet(){$('#sp').textContent=T[lang].sp+P[idx][lang];sheet.classList.add('on');setTimeout(()=>$('#code').focus({preventScroll:true}),400)}
function closeSheet(){sheet.classList.remove('on');$('#enter').focus()}
$('#enter').onclick=openSheet;$('#xs').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet.classList.contains('on'))closeSheet()});
$('#form').onsubmit=e=>{e.preventDefault();sheet.classList.remove('on');toast.textContent=T[lang].toast+P[idx][lang];toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),2200);$('#code').value=''};
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(layout,60)});
tr();setText(true);
items.forEach(it=>it.arm.style.transition='none');layout();
requestAnimationFrame(()=>requestAnimationFrame(()=>items.forEach(it=>it.arm.style.transition='')));
</script>
</body>
